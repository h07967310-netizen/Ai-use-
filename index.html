<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Study AI App</title>
  <style>
    * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
    body {
      margin: 0;
      padding: 14px;
      background: #0f172a;
      color: #f8fafc;
    }
    .app {
      max-width: 680px;
      margin: auto;
      background: #1e293b;
      padding: 16px;
      border-radius: 14px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.35);
    }
    h2 { margin: 0 0 12px; font-size: 20px; color: #38bdf8; text-align: center; }
    .box {
      background: #0f172a;
      padding: 12px;
      border-radius: 10px;
      margin-bottom: 12px;
      border: 1px solid #334155;
    }
    label { display: block; font-size: 13px; margin-bottom: 6px; color: #cbd5e1; }
    input[type="password"], input[type="text"], textarea {
      width: 100%;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #475569;
      background: #1e293b;
      color: #fff;
      font-size: 14px;
    }
    textarea { min-height: 85px; resize: vertical; }
    .row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
    button {
      padding: 10px 14px;
      border: none;
      border-radius: 8px;
      background: #0284c7;
      color: #fff;
      font-weight: 600;
      cursor: pointer;
      font-size: 14px;
    }
    button:hover { background: #0369a1; }
    button.secondary { background: #334155; }
    button.secondary:hover { background: #475569; }
    .answer {
      white-space: pre-wrap;
      line-height: 1.6;
      font-size: 15px;
      min-height: 70px;
    }
    .video-wrap {
      position: relative;
      width: 100%;
      padding-bottom: 56.25%;
      height: 0;
      overflow: hidden;
      border-radius: 10px;
      margin-top: 10px;
      background: #000;
    }
    .video-wrap iframe {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      border: 0;
    }
    .small { font-size: 12px; color: #94a3b8; margin-top: 6px; }
    img#preview {
      max-width: 100%;
      max-height: 180px;
      border-radius: 8px;
      margin-top: 8px;
      display: none;
    }
  </style>
</head>
<body>
  <div class="app">
    <h2>পড়ালেখা AI অ্যাপ</h2>

    <!-- API Key সেটিংস -->
    <div class="box">
      <label>Gemini API Key (শুধু আপনার ফোনের ব্রাউজারে সেভ থাকবে)</label>
      <div class="row">
        <input type="password" id="apiKeyInput" placeholder="এখানে Gemini API Key দিন..." />
        <button onclick="saveKey()">সেভ করুন</button>
      </div>
      <div class="small" id="keyStatus">API Key সেভ করা হয়নি।</div>
    </div>

    <!-- প্রশ্ন করা ও ছবি/ভয়েস -->
    <div class="box">
      <label>আপনার প্রশ্ন লিখুন বা বলুন</label>
      <textarea id="promptInput" placeholder="যেমন: নিউটনের গতির প্রথম সূত্র সহজ করে বুঝিয়ে দাও..."></textarea>

      <div class="row">
        <button onclick="askGemini()">উত্তর খুঁজুন</button>
        <button class="secondary" onclick="startVoice()">ভয়েস (মাইক)</button>
        <label class="secondary" style="padding:10px 14px;border-radius:8px;cursor:pointer;margin:0;">
          ছবি নিন/দিন
          <input type="file" id="imageInput" accept="image/*" capture="environment" style="display:none;" onchange="handleImage(event)" />
        </label>
      </div>
      <img id="preview" alt="ছবির প্রিভিউ" />
    </div>

    <!-- উত্তর দেখার জায়গা -->
    <div class="box">
      <label>উত্তর</label>
      <div class="answer" id="outputText">এখানে আপনার প্রশ্নের উত্তর দেখা যাবে।</div>
    </div>

    <!-- YouTube ভিডিও সেকশন -->
    <div class="box">
      <label>পড়ালেখার YouTube ভিডিও লিংক বা ID দিন</label>
      <div class="row">
        <input type="text" id="ytInput" placeholder="YouTube লিংক বা ভিডিও ID দিন..." />
        <button class="secondary" onclick="loadVideo()">ভিডিও দেখুন</button>
      </div>
      <div class="video-wrap">
        <iframe id="ytFrame" src="https://www.youtube.com/embed/dQw4w9WgXcQ" allowfullscreen></iframe>
      </div>
    </div>
  </div>

  <script>
    let base64Image = null;
    let imageMimeType = null;

    window.onload = () => {
      const savedKey = localStorage.getItem("gemini_study_key");
      if (savedKey) {
        document.getElementById("apiKeyInput").value = savedKey;
        document.getElementById("keyStatus").innerText = "API Key এই ব্রাউজারে সেভ করা আছে।";
      }
    };

    function saveKey() {
      const key = document.getElementById("apiKeyInput").value.trim();
      if (!key) return alert("আগে একটি API Key লিখুন।");
      localStorage.setItem("gemini_study_key", key);
      document.getElementById("keyStatus").innerText = "API Key সেভ করা হয়েছে!";
    }

    function handleImage(event) {
      const file = event.target.files[0];
      if (!file) return;
      imageMimeType = file.type;
      const reader = new FileReader();
      reader.onload = () => {
        const result = reader.result;
        document.getElementById("preview").src = result;
        document.getElementById("preview").style.display = "block";
        base64Image = result.split(",")[1];
      };
      reader.readAsDataURL(file);
    }

    function startVoice() {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) {
        return alert("এই ব্রাউজারে ভয়েস ইনপুট সাপোর্ট করছে না, টাইপ করে প্রশ্ন লিখুন।");
      }
      const recognition = new SpeechRecognition();
      recognition.lang = "bn-BD";
      recognition.start();
      document.getElementById("outputText").innerText = "শুনছি... কথা বলুন।";
      recognition.onresult = (e) => {
        const transcript = e.results[0][0].transcript;
        document.getElementById("promptInput").value = transcript;
        document.getElementById("outputText").innerText = "ভয়েস থেকে লেখা হয়েছে: " + transcript;
      };
      recognition.onerror = () => {
        document.getElementById("outputText").innerText = "ভয়েস বোঝা যায়নি, আবার চেষ্টা করুন।";
      };
    }

    async function askGemini() {
      const apiKey = localStorage.getItem("gemini_study_key") || document.getElementById("apiKeyInput").value.trim();
      const prompt = document.getElementById("promptInput").value.trim();
      const out = document.getElementById("outputText");

      if (!apiKey) return alert("আগে Gemini API Key দিন এবং সেভ করুন।");
      if (!prompt && !base64Image) return alert("প্রশ্ন লিখুন অথবা একটি ছবি সিলেক্ট করুন।");

      out.innerText = "উত্তর তৈরি হচ্ছে, একটু অপেক্ষা করুন...";

      const parts = [];
      if (prompt) parts.push({ text: prompt });
      if (base64Image) {
        parts.push({
          inline_data: {
            mime_type: imageMimeType || "image/jpeg",
            data: base64Image
          }
        });
      }

      try {
        const res = await fetch(
          `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${encodeURIComponent(apiKey)}`,
          {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              contents: [{ parts }]
            })
          }
        );
        const data = await res.json();
        const reply = data?.candidates?.[0]?.content?.parts?.[0]?.text;
        out.innerText = reply || (data?.error?.message ? "সমস্যা: " + data.error.message : "কোনো উত্তর পাওয়া যায়নি।");
      } catch (err) {
        out.innerText = "নেটওয়ার্ক বা API সমস্যা হয়েছে: " + err.message;
      }
    }

    function extractYouTubeId(input) {
      input = input.trim();
      if (/^[a-zA-Z0-9_-]{11}$/.test(input)) return input;
      const match = input.match(/(?:v=|\/embed\/|youtu\.be\/|\/shorts\/)([a-zA-Z0-9_-]{11})/);
      return match ? match[1] : null;
    }

    function loadVideo() {
      const val = document.getElementById("ytInput").value;
      const id = extractYouTubeId(val);
      if (!id) return alert("সঠিক YouTube লিংক বা ১১ অক্ষরের ভিডিও ID দিন।");
      document.getElementById("ytFrame").src = `https://www.youtube.com/embed/${id}`;
    }
  </script>
</body>
</html>
